name: Build and verify Debian release

on:
  push:
    branches: [main]
    tags: ['vps-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: n4ml-vps
          path: release/
          compression-level: 0
          retention-days: 1

  debian:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim
      options: --memory 1g --cpus 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: n4ml-vps
          path: release
      - name: Configure Debian without systemd in the test container
        run: bash deploy/setup-debian.sh n4ml.example --no-start
      - name: Verify installer, rollback, resource limits, and static Nginx serving
        run: |
          cd release && sha256sum --check SHA256SUMS && cd ..
          python3 -m unittest discover -s tests/deploy -v
          python3 tests/deploy/nginx_smoke.py release/n4ml-vps.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/vps-')
    needs: [build, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: n4ml-vps
          path: release
      - name: Publish the tested server bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "Debian VPS release $RELEASE_TAG"
