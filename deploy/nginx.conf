# Managed by N4ML. Install once; Certbot may add HTTPS configuration here.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /srv/n4ml/current;
    index index.html;
    server_tokens off;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    client_max_body_size 1m;

    # Ship precompressed text. Do not spend the single CPU gzipping responses.
    gzip off;
    gzip_static on;
    gzip_vary on;
    access_log off;
    error_log /var/log/nginx/n4ml-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /audio/ {
        try_files $uri =404;
        gzip_static off;
        max_ranges 1;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    # Each project has a real index.html. Missing assets must return 404,
    # rather than accidentally serving the homepage as JavaScript or audio.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
